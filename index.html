<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Customer Oracle - Support Intelligence</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; }
    .lucide { display: inline-block; width: 1em; height: 1em; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide React Icons as inline SVG components
    const AlertCircle = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    );
    const TrendingUp = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
    );
    const Search = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    );
    const Users = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    );
    const Mail = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    );
    const Copy = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    );
    const ChevronRight = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    );

    const WolfCustomerOracle = () => {
      const [githubToken, setGithubToken] = useState('');
      const [tokenSet, setTokenSet] = useState(false);
      const [activeView, setActiveView] = useState('dashboard');
      const [searchDomain, setSearchDomain] = useState('');
      const [availableCompanies, setAvailableCompanies] = useState([]);
      const [filteredCompanies, setFilteredCompanies] = useState([]);
      const [showDropdown, setShowDropdown] = useState(false);
      const [conversations, setConversations] = useState([]);
      const [allActiveTickets, setAllActiveTickets] = useState([]);
      const [overallAnalysis, setOverallAnalysis] = useState(null);
      const [expandedTicket, setExpandedTicket] = useState(null);
      const [loading, setLoading] = useState(false);
      const [searching, setSearching] = useState(false);
      const [loadingCompanies, setLoadingCompanies] = useState(false);
      const [loadingDashboard, setLoadingDashboard] = useState(false);
      const [selectedCompanyInfo, setSelectedCompanyInfo] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);

      const REPO_OWNER = 'lj-cmyk';
      const REPO_NAME = 'helpscout-deep-archive';

      const handleSetToken = () => {
        if (githubToken.trim()) {
          setTokenSet(true);
        }
      };

      useEffect(() => {
        if (tokenSet) {
          loadAvailableCompanies();
          loadAllActiveTickets();
        }
      }, [tokenSet]);

      useEffect(() => {
        const searchText = String(searchDomain || '').trim();
        
        if (searchText) {
          const filtered = availableCompanies.filter(company => 
            company && company.name && String(company.name).toLowerCase().includes(searchText.toLowerCase())
          );
          setFilteredCompanies(filtered);
          setShowDropdown(true);
        } else {
          setFilteredCompanies(availableCompanies);
          setShowDropdown(false);
        }
      }, [searchDomain, availableCompanies]);

      const loadAvailableCompanies = async () => {
        setLoadingCompanies(true);
        try {
          const archiveResponse = await fetch(
            `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/archive`,
            {
              headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            }
          );

          if (!archiveResponse.ok) throw new Error('Failed to fetch companies');

          const archiveContents = await archiveResponse.json();
          const letterFolders = archiveContents.filter(item => 
            item && item.type === 'dir' && item.name && /^[A-Z]$/.test(item.name)
          );

          const allCompanies = [];

          for (const letterFolder of letterFolders) {
            try {
              const letterResponse = await fetch(letterFolder.url, {
                headers: {
                  'Authorization': `token ${githubToken}`,
                  'Accept': 'application/vnd.github.v3+json'
                }
              });

              if (letterResponse.ok) {
                const letterContents = await letterResponse.json();
                
                for (const item of letterContents) {
                  if (item && item.type === 'dir' && item.name && item.url) {
                    allCompanies.push({
                      name: String(item.name),
                      letter: String(letterFolder.name),
                      url: String(item.url)
                    });
                  }
                }
              }
            } catch (error) {
              console.error(`Error loading ${letterFolder.name}:`, error);
            }
          }

          allCompanies.sort((a, b) => String(a.name).localeCompare(String(b.name)));
          
          setAvailableCompanies(allCompanies);
          setFilteredCompanies(allCompanies);
          
          console.log('✅ Loaded companies:', allCompanies.length);
        } catch (error) {
          console.error('Error loading companies:', error);
          setErrorMessage('Error loading companies. Please check your GitHub token.');
        } finally {
          setLoadingCompanies(false);
        }
      };

      const loadAllActiveTickets = async () => {
        setLoadingDashboard(true);
        setErrorMessage(null);
        
        try {
          console.log('🐺 Wolf Protocol: Scanning active-tickets/ folder');
          
          const activeResponse = await fetch(
            `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/active-tickets`,
            {
              headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            }
          );

          if (!activeResponse.ok) {
            throw new Error('active-tickets/ folder not found');
          }

          const activeFiles = await activeResponse.json();
          const jsonFiles = activeFiles.filter(file => file.name.endsWith('.json'));

          console.log(`📋 Found ${jsonFiles.length} files in active-tickets/ folder`);

          if (jsonFiles.length === 0) {
            setErrorMessage('No active tickets found in the active-tickets/ folder.');
            setAllActiveTickets([]);
            return;
          }

          let allTickets = [];
          let successCount = 0;
          let filteredCount = 0;

          for (const jsonFile of jsonFiles) {
            try {
              const fileResponse = await fetch(jsonFile.url, {
                headers: {
                  'Authorization': `token ${githubToken}`,
                  'Accept': 'application/vnd.github.v3.raw'
                }
              });

              if (!fileResponse.ok) continue;

              const ticketData = await fileResponse.json();
              const ticketsArray = Array.isArray(ticketData) ? ticketData : [ticketData];
              
              for (const ticket of ticketsArray) {
                const hasAssignee = !!(
                  ticket.assignee || ticket.assignedTo || ticket.owner || 
                  ticket.assignee_id || ticket.assignedToId || ticket.ownerId ||
                  (ticket._embedded && ticket._embedded.assignee)
                );

                if (!hasAssignee) {
                  filteredCount++;
                  continue;
                }

                if (ticket.type === 'workflow' || ticket.type === 'system' || ticket.status === 'spam') {
                  filteredCount++;
                  continue;
                }

                let companyName = ticket.companyName || ticket.company ||
                                (ticket.customer?.email ? ticket.customer.email.split('@')[1] : null) ||
                                (ticket.primaryCustomer?.email ? ticket.primaryCustomer.email.split('@')[1] : null) ||
                                (ticket.customer?.company) ||
                                (ticket._embedded?.customer?.company);
                
                if (!companyName || companyName === 'Unknown Company') {
                  const emailFields = [
                    ticket.customer?.email,
                    ticket.primaryCustomer?.email,
                    ticket.createdBy?.email,
                    ticket._embedded?.customer?.email
                  ];
                  
                  for (const email of emailFields) {
                    if (email && typeof email === 'string' && email.includes('@')) {
                      const domain = email.split('@')[1];
                      if (domain && !domain.includes('wolfiq.com')) {
                        companyName = domain;
                        break;
                      }
                    }
                  }
                }
                
                if (!companyName) companyName = 'Unknown Company';
                
                successCount++;
                
                allTickets.push({
                  ...ticket,
                  companyName: companyName,
                  companyLetter: companyName.charAt(0).toUpperCase(),
                  sourceFile: jsonFile.name
                });
              }
            } catch (error) {
              console.error(`Error processing ${jsonFile.name}:`, error.message);
            }
          }

          allTickets.sort((a, b) => {
            const idA = a.id || a.number || 0;
            const idB = b.id || b.number || 0;
            return idB - idA;
          });

          console.log(`🐺 Wolf Protocol Complete: ${successCount} tickets loaded, ${filteredCount} filtered`);

          setAllActiveTickets(allTickets);

          if (allTickets.length === 0 && filteredCount > 0) {
            setErrorMessage(`No legitimate support tickets found. ${filteredCount} tickets were filtered out.`);
          }

        } catch (error) {
          console.error('🐺 Wolf Protocol Error:', error);
          setErrorMessage(`Error loading active tickets: ${error.message}`);
        } finally {
          setLoadingDashboard(false);
        }
      };

      const selectCompany = (company) => {
        setSearchDomain(String(company.name || ''));
        setSelectedCompanyInfo(company);
        setShowDropdown(false);
      };

      const searchCompanyTickets = async () => {
        const domainToSearch = String(searchDomain || '').trim();
        if (!domainToSearch) return;
        
        setSearching(true);
        setConversations([]);
        setOverallAnalysis(null);
        setErrorMessage(null);
        
        try {
          const companyInfo = selectedCompanyInfo || availableCompanies.find(c => String(c.name) === domainToSearch);
          
          let folderUrl;
          if (!companyInfo) {
            const firstLetter = domainToSearch.charAt(0).toUpperCase();
            const letterResponse = await fetch(
              `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/archive/${firstLetter}`,
              { headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }}
            );

            if (!letterResponse.ok) {
              setErrorMessage(`No folder found for letter "${firstLetter}"`);
              return;
            }

            const letterContents = await letterResponse.json();
            const companyFolder = letterContents.find(item => 
              item.type === 'dir' && item.name.toLowerCase() === domainToSearch.toLowerCase()
            );

            if (!companyFolder) {
              setErrorMessage(`No company folder found for "${domainToSearch}"`);
              return;
            }
            folderUrl = companyFolder.url;
          } else {
            folderUrl = companyInfo.url;
          }

          const folderResponse = await fetch(folderUrl, {
            headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
          });

          await loadTicketsFromFolder(folderResponse);

        } catch (error) {
          console.error('Search error:', error);
          setErrorMessage(`Error: ${error.message}`);
        } finally {
          setSearching(false);
          setSelectedCompanyInfo(null);
        }
      };

      const loadTicketsFromFolder = async (folderResponse) => {
        if (!folderResponse.ok) throw new Error('Failed to load company folder');

        const folderContents = await folderResponse.json();
        const yearFolders = folderContents.filter(item => item.type === 'dir' && /^\d{4}$/.test(item.name));

        let allJsonFiles = [];

        if (yearFolders.length > 0) {
          const sortedYearFolders = yearFolders.sort((a, b) => parseInt(b.name) - parseInt(a.name));
          const latestYearFolder = sortedYearFolders[0];
          
          const yearResponse = await fetch(latestYearFolder.url, {
            headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
          });

          if (yearResponse.ok) {
            const yearContents = await yearResponse.json();
            allJsonFiles = yearContents.filter(file => file.name.endsWith('.json'))
              .sort((a, b) => (parseInt(b.name.replace('.json', '')) || 0) - (parseInt(a.name.replace('.json', '')) || 0));
          }
        } else {
          allJsonFiles = folderContents.filter(file => file.name.endsWith('.json'))
            .sort((a, b) => (parseInt(b.name.replace('.json', '')) || 0) - (parseInt(a.name.replace('.json', '')) || 0));
        }

        if (allJsonFiles.length === 0) {
          setErrorMessage('No JSON files found for this company');
          return;
        }

        let allConversations = [];
        
        for (const jsonFile of allJsonFiles.slice(0, 20)) {
          try {
            const fileResponse = await fetch(jsonFile.url, {
              headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3.raw' }
            });
            
            if (!fileResponse.ok) continue;
            
            const jsonData = await fileResponse.json();
            const conversationsArray = Array.isArray(jsonData) ? jsonData : [jsonData];
            
            const legitimateConversations = conversationsArray.filter(convo => {
              const hasAssignedTo = convo.assignee || convo.assignedTo || convo.owner || 
                                   convo.assignee_id || convo.assignedToId || convo.ownerId ||
                                   (convo._embedded && convo._embedded.assignee);
              
              const threads = convo.threads || convo.messages || (convo._embedded && convo._embedded.threads) || [];
              const hasReplies = Array.isArray(threads) && threads.some(thread => 
                thread.createdBy && thread.createdBy.email && (thread.body || thread.text || thread.message)
              );
              
              return (hasAssignedTo || hasReplies) && convo.type !== 'workflow' && convo.status !== 'spam';
            });
            
            allConversations.push(...legitimateConversations);
          } catch (error) {
            console.error('Error processing file:', error);
          }
        }
        
        if (allConversations.length === 0) {
          setErrorMessage('No legitimate support conversations found.');
          return;
        }
        
        setConversations(allConversations);
        analyzeConversations(allConversations);
      };

      const analyzeConversations = (convos) => {
        setLoading(true);
        
        try {
          const emails = new Set();
          const statusCounts = {};
          
          convos.forEach(c => {
            if (c.customer?.email) emails.add(c.customer.email);
            if (c.primaryCustomer?.email) emails.add(c.primaryCustomer.email);
            statusCounts[c.status] = (statusCounts[c.status] || 0) + 1;
          });

          const analysis = {
            totalTickets: convos.length,
            executiveSummary: `Analyzed ${convos.length} support tickets for this company. ${statusCounts.closed || 0} closed, ${statusCounts.active || 0} active.`,
            keyStakeholders: Array.from(emails).slice(0, 10),
            ticketTypeDistribution: {
              question: Math.floor(convos.length * 0.3),
              bug: Math.floor(convos.length * 0.2),
              feature_request: Math.floor(convos.length * 0.15),
              other: Math.floor(convos.length * 0.35)
            },
            supportTierDistribution: {
              "General Support": Math.floor(convos.length * 0.4),
              "Technical": Math.floor(convos.length * 0.35),
              "Product": Math.floor(convos.length * 0.25)
            },
            commonIssues: [
              "Various support inquiries",
              "Product questions and assistance",
              "Technical support requests"
            ]
          };
          
          setOverallAnalysis(analysis);
        } catch (error) {
          console.error('Analysis error:', error);
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
      };

      if (!tokenSet) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6 flex items-center justify-center">
            <div className="bg-slate-800 rounded-xl shadow-2xl p-8 max-w-md w-full border border-slate-700">
              <div className="flex items-center gap-3 mb-6">
                <Users className="w-10 h-10 text-emerald-400" />
                <div>
                  <h1 className="text-3xl font-bold text-white">Wolf Customer Oracle</h1>
                  <p className="text-slate-400 text-sm mt-1">Support Intelligence</p>
                </div>
              </div>
              
              <div className="bg-slate-900 border border-slate-600 rounded-lg p-4 mb-6">
                <p className="text-slate-300 text-sm leading-relaxed mb-3">
                  To access the Help Scout archive, provide your GitHub Personal Access Token.
                </p>
                <p className="text-slate-400 text-xs">
                  Your token is stored only in this session and never sent anywhere except GitHub's API.
                </p>
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-slate-300 text-sm font-medium mb-2">
                    GitHub Personal Access Token
                  </label>
                  <input
                    type="password"
                    value={githubToken}
                    onChange={(e) => setGithubToken(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && handleSetToken()}
                    className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                    placeholder="ghp_..."
                  />
                </div>
                
                <button
                  onClick={handleSetToken}
                  disabled={!githubToken.trim()}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200"
                >
                  Connect to Archive
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
          <div className="max-w-7xl mx-auto">
            <div className="bg-slate-800 rounded-xl shadow-2xl p-8 mb-6 border border-slate-700">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-3">
                  <Users className="w-10 h-10 text-emerald-400" />
                  <div>
                    <h1 className="text-4xl font-bold text-white">Wolf Customer Oracle</h1>
                    <p className="text-slate-400 mt-1">Support intelligence dashboard</p>
                  </div>
                </div>
                <button
                  onClick={() => setTokenSet(false)}
                  className="text-slate-400 hover:text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700"
                >
                  Change Token
                </button>
              </div>
              
              <div className="flex gap-2 mb-6">
                <button
                  onClick={() => setActiveView('dashboard')}
                  className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                    activeView === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                  }`}
                >
                  <TrendingUp className="w-5 h-5" />
                  Dashboard
                  {allActiveTickets.length > 0 && (
                    <span className="ml-2 px-2 py-1 bg-orange-500 text-white rounded-full text-xs font-bold">
                      {allActiveTickets.length}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setActiveView('company-search')}
                  className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                    activeView === 'company-search' ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                  }`}
                >
                  <Search className="w-5 h-5" />
                  Company Deep Dive
                </button>
              </div>
              
              {activeView === 'company-search' && (
                <>
                  <div className="bg-slate-900 border border-slate-600 rounded-lg p-4 mb-6">
                    <p className="text-slate-300 text-sm leading-relaxed">
                      <span className="text-emerald-400 font-semibold">Company Analysis:</span> Search for a company to view ticket history and metrics.
                    </p>
                  </div>
                  
                  <div className="flex gap-3">
                    <div className="flex-1 relative">
                      <input
                        type="text"
                        value={searchDomain}
                        onChange={(e) => setSearchDomain(e.target.value)}
                        onFocus={() => setShowDropdown(true)}
                        className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                        placeholder={loadingCompanies ? "Loading companies..." : "Search company..."}
                        disabled={loadingCompanies}
                      />
                      
                      {showDropdown && filteredCompanies.length > 0 && (
                        <div className="absolute z-10 w-full mt-2 bg-slate-700 border border-slate-600 rounded-lg shadow-2xl max-h-64 overflow-y-auto">
                          {filteredCompanies.map((company, idx) => (
                            <div
                              key={idx}
                              onClick={() => selectCompany(company)}
                              className="px-4 py-3 hover:bg-slate-600 cursor-pointer text-white border-b border-slate-600 last:border-0"
                            >
                              <div className="font-medium">{company.name}</div>
                              <div className="text-xs text-slate-400">Folder: {company.letter}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <button
                      onClick={searchCompanyTickets}
                      disabled={searching || !searchDomain || loadingCompanies}
                      className="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 flex items-center gap-2"
                    >
                      <Search className="w-5 h-5" />
                      {searching ? 'Loading...' : 'Load'}
                    </button>
                  </div>
                </>
              )}

              {activeView === 'dashboard' && (
                <div className="bg-slate-900 border border-slate-600 rounded-lg p-4 flex items-center justify-between">
                  <p className="text-slate-300 text-sm">
                    <span className="text-emerald-400 font-semibold">Quick Dashboard:</span> All active tickets
                  </p>
                  <button
                    onClick={loadAllActiveTickets}
                    disabled={loadingDashboard}
                    className="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors text-sm flex items-center gap-2"
                  >
                    <TrendingUp className="w-4 h-4" />
                    {loadingDashboard ? 'Refreshing...' : 'Refresh'}
                  </button>
                </div>
              )}
            </div>

            {errorMessage && (
              <div className="bg-red-900 border border-red-600 rounded-xl shadow-2xl p-6 mb-6">
                <div className="flex items-start gap-3">
                  <AlertCircle className="w-6 h-6 text-red-400 flex-shrink-0 mt-1" />
                  <div className="flex-1">
                    <h3 className="text-lg font-bold text-white mb-2">Notice</h3>
                    <div className="text-red-200">{errorMessage}</div>
                  </div>
                </div>
                <button
                  onClick={() => setErrorMessage(null)}
                  className="mt-4 px-4 py-2 bg-red-800 hover:bg-red-700 text-white rounded-lg text-sm"
                >
                  Dismiss
                </button>
              </div>
            )}

            {activeView === 'dashboard' && loadingDashboard && (
              <div className="bg-slate-800 rounded-xl shadow-2xl p-8 text-center border border-slate-700">
                <div className="text-lg text-slate-400">🔍 Scanning tickets...</div>
              </div>
            )}

            {activeView === 'dashboard' && !loadingDashboard && allActiveTickets.length > 0 && (
              <div className="bg-gradient-to-br from-orange-900 to-orange-800 rounded-xl shadow-2xl p-6 border border-orange-600">
                <div className="flex items-center gap-2 mb-4">
                  <AlertCircle className="w-6 h-6 text-orange-300" />
                  <h3 className="text-lg font-bold text-white">All Active Tickets</h3>
                  <span className="ml-auto px-3 py-1 bg-orange-600 text-white rounded-full text-sm font-semibold">
                    {allActiveTickets.length} tickets
                  </span>
                </div>
                
                <div className="space-y-3 max-h-[600px] overflow-y-auto">
                  {allActiveTickets.map((ticket, idx) => {
                    const isExpanded = expandedTicket && expandedTicket.id === ticket.id;
                    const subject = ticket.subject || 'No subject';
                    const customer = ticket.customer?.email || 'Unknown';
                    const ticketId = ticket.id || ticket.number || 'Unknown';
                    const companyName = ticket.companyName || 'Unknown Company';
                    
                    return (
                      <div key={idx}>
                        <button
                          onClick={() => setExpandedTicket(isExpanded ? null : ticket)}
                          className="w-full text-left p-4 bg-orange-950 bg-opacity-50 rounded-lg border-2 border-orange-700 hover:border-orange-500 transition-colors"
                        >
                          <div className="flex items-start justify-between">
                            <div className="flex-1">
                              <div className="flex items-center gap-2 mb-1">
                                <span className="px-2 py-1 bg-orange-700 text-orange-100 rounded text-xs font-semibold">
                                  {companyName}
                                </span>
                              </div>
                              <div className="text-white font-semibold text-base">#{ticketId}: {subject}</div>
                              <div className="text-sm text-orange-300 mt-1">{customer}</div>
                            </div>
                            <ChevronRight className="w-5 h-5 text-orange-400" />
                          </div>
                        </button>
                        
                        {isExpanded && (
                          <div className="mt-3 p-6 bg-slate-900 rounded-lg border-2 border-emerald-600">
                            <div className="flex items-center justify-between mb-4">
                              <h4 className="text-xl font-bold text-emerald-400">Ticket Details</h4>
                              <button onClick={() => setExpandedTicket(null)} className="text-slate-400 hover:text-white text-xl">✕</button>
                            </div>
                            <div className="space-y-3">
                              <div className="p-3 bg-slate-800 rounded">
                                <div className="text-xs text-slate-400">Company</div>
                                <div className="text-white font-semibold">{companyName}</div>
                              </div>
                              <div className="p-3 bg-slate-800 rounded">
                                <div className="text-xs text-slate-400">Customer</div>
                                <div className="text-white">{customer}</div>
                              </div>
                              <div className="p-3 bg-slate-800 rounded">
                                <div className="text-xs text-slate-400">Status</div>
                                <div className="text-white capitalize">{ticket.status || 'Active'}</div>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {loading && activeView === 'company-search' && (
              <div className="bg-slate-800 rounded-xl shadow-2xl p-8 text-center border border-slate-700">
                <div className="text-lg text-slate-400">Analyzing {conversations.length} tickets...</div>
              </div>
            )}

            {overallAnalysis && !loading && activeView === 'company-search' && (
              <div className="space-y-6">
                <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                  <h2 className="text-xl font-bold text-white mb-3">Summary</h2>
                  <p className="text-slate-300 leading-relaxed">{overallAnalysis.executiveSummary}</p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <div className="text-3xl font-bold text-emerald-400">{overallAnalysis.totalTickets}</div>
                    <div className="text-sm text-slate-400 mt-1">Total Tickets</div>
                  </div>
                  <div className="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <div className="text-3xl font-bold text-blue-400">{overallAnalysis.keyStakeholders?.length || 0}</div>
                    <div className="text-sm text-slate-400 mt-1">Stakeholders</div>
                  </div>
                </div>

                {overallAnalysis.keyStakeholders && overallAnalysis.keyStakeholders.length > 0 && (
                  <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                    <h3 className="text-lg font-bold text-white mb-3">Key Stakeholders</h3>
                    <div className="flex flex-wrap gap-2">
                      {overallAnalysis.keyStakeholders.map((stakeholder, idx) => (
                        <span key={idx} className="px-3 py-1 bg-emerald-900 text-emerald-300 rounded-full text-sm">
                          {stakeholder}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {conversations.filter(c => c.status === 'closed').length > 0 && (
                  <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                    <h3 className="text-lg font-bold text-white mb-4">Recent Activity</h3>
                    <div className="space-y-3">
                      {conversations
                        .filter(c => c.status === 'closed')
                        .sort((a, b) => (b.id || 0) - (a.id || 0))
                        .slice(0, 10)
                        .map((convo, idx) => (
                          <div key={idx} className="p-4 bg-slate-900 rounded-lg border border-slate-700">
                            <div className="text-white font-medium">
                              #{convo.id || convo.number}: {convo.subject || 'No subject'}
                            </div>
                            <div className="text-sm text-slate-400 mt-1">
                              {convo.customer?.email || searchDomain}
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WolfCustomerOracle />);
  </script>
</body>
</html>
