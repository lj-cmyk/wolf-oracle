<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Customer Oracle - AI-Powered Support Intelligence</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { AlertCircle, TrendingUp, MessageSquare, Clock, Search, Users, Mail, Copy, ChevronRight, FileCode } = lucide;

    const WolfCustomerOracle = () => {
    import React, { useState, useEffect } from 'react';
import { AlertCircle, TrendingUp, MessageSquare, Clock, Search, Users, Mail, Copy, ChevronRight, FileCode } from 'lucide-react';

const WolfCustomerOracle = () => {
  const [githubToken, setGithubToken] = useState('');
  const [tokenSet, setTokenSet] = useState(false);
  const [activeView, setActiveView] = useState('dashboard');
  const [searchDomain, setSearchDomain] = useState('');
  const [availableCompanies, setAvailableCompanies] = useState([]);
  const [filteredCompanies, setFilteredCompanies] = useState([]);
  const [showDropdown, setShowDropdown] = useState(false);
  const [conversations, setConversations] = useState([]);
  const [allActiveTickets, setAllActiveTickets] = useState([]);
  const [overallAnalysis, setOverallAnalysis] = useState(null);
  const [expandedTicket, setExpandedTicket] = useState(null);
  const [draftReply, setDraftReply] = useState(null);
  const [loading, setLoading] = useState(false);
  const [searching, setSearching] = useState(false);
  const [loadingCompanies, setLoadingCompanies] = useState(false);
  const [loadingDashboard, setLoadingDashboard] = useState(false);
  const [generatingDraft, setGeneratingDraft] = useState(false);
  const [selectedCompanyInfo, setSelectedCompanyInfo] = useState(null);
  const [errorMessage, setErrorMessage] = useState(null);

  const REPO_OWNER = 'lj-cmyk';
  const REPO_NAME = 'helpscout-deep-archive';

  const handleSetToken = () => {
    if (githubToken.trim()) {
      setTokenSet(true);
    }
  };

  useEffect(() => {
    if (tokenSet) {
      loadAvailableCompanies();
      loadAllActiveTickets();
    }
  }, [tokenSet]);

  useEffect(() => {
    const searchText = String(searchDomain || '').trim();
    
    if (searchText) {
      const filtered = [];
      for (const company of availableCompanies) {
        if (company && company.name && String(company.name).toLowerCase().includes(searchText.toLowerCase())) {
          filtered.push(company);
        }
      }
      setFilteredCompanies(filtered);
      setShowDropdown(true);
    } else {
      setFilteredCompanies(availableCompanies);
      setShowDropdown(false);
    }
  }, [searchDomain, availableCompanies]);

  const loadAvailableCompanies = async () => {
    setLoadingCompanies(true);
    try {
      const archiveResponse = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/archive`,
        {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        }
      );

      if (!archiveResponse.ok) throw new Error('Failed to fetch companies');

      const archiveContents = await archiveResponse.json();
      const letterFolders = [];
      
      for (const item of archiveContents) {
        if (item && item.type === 'dir' && item.name && /^[A-Z]$/.test(item.name)) {
          letterFolders.push(item);
        }
      }

      const allCompanies = [];

      for (const letterFolder of letterFolders) {
        try {
          const letterResponse = await fetch(letterFolder.url, {
            headers: {
              'Authorization': `token ${githubToken}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });

          if (letterResponse.ok) {
            const letterContents = await letterResponse.json();
            
            for (const item of letterContents) {
              if (item && item.type === 'dir' && item.name && item.url) {
                allCompanies.push({
                  name: String(item.name),
                  letter: String(letterFolder.name),
                  url: String(item.url)
                });
              }
            }
          }
        } catch (error) {
          console.error(`Error loading ${letterFolder.name}:`, error);
        }
      }

      allCompanies.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      
      setAvailableCompanies(allCompanies);
      setFilteredCompanies(allCompanies);
      
      console.log('✅ Loaded companies:', allCompanies.length);
    } catch (error) {
      console.error('Error loading companies:', error);
      setErrorMessage('Error loading companies. Please check your GitHub token and try again.');
    } finally {
      setLoadingCompanies(false);
    }
  };

  const loadAllActiveTickets = async () => {
    setLoadingDashboard(true);
    setErrorMessage(null);
    
    try {
      console.log('🐺 Wolf Protocol: Scanning active-tickets/ folder');
      
      const activeResponse = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/active-tickets`,
        {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        }
      );

      if (!activeResponse.ok) {
        throw new Error('active-tickets/ folder not found');
      }

      const activeFiles = await activeResponse.json();
      const jsonFiles = activeFiles.filter(file => file.name.endsWith('.json'));

      console.log(`📋 Found ${jsonFiles.length} files in active-tickets/ folder`);

      if (jsonFiles.length === 0) {
        setErrorMessage('No active tickets found in the active-tickets/ folder.');
        setAllActiveTickets([]);
        return;
      }

      let allTickets = [];
      let successCount = 0;
      let errorCount = 0;
      let filteredCount = 0;

      for (const jsonFile of jsonFiles) {
        try {
          console.log(`  📄 Loading: ${jsonFile.name}`);
          
          const fileResponse = await fetch(jsonFile.url, {
            headers: {
              'Authorization': `token ${githubToken}`,
              'Accept': 'application/vnd.github.v3.raw'
            }
          });

          if (!fileResponse.ok) {
            console.error(`  ❌ Failed to load ${jsonFile.name}`);
            errorCount++;
            continue;
          }

          const ticketData = await fileResponse.json();
          const ticketsArray = Array.isArray(ticketData) ? ticketData : [ticketData];
          
          for (const ticket of ticketsArray) {
            const hasAssignee = !!(
              ticket.assignee || 
              ticket.assignedTo || 
              ticket.owner || 
              ticket.assignee_id ||
              ticket.assignedToId ||
              ticket.ownerId ||
              (ticket._embedded && ticket._embedded.assignee)
            );

            if (!hasAssignee) {
              filteredCount++;
              console.log(`  🚫 Filtered: ${ticket.subject} (No assignee)`);
              continue;
            }

            if (ticket.type === 'workflow' || ticket.type === 'system' || ticket.status === 'spam') {
              filteredCount++;
              console.log(`  🚫 Filtered: ${ticket.subject} (System type: ${ticket.type})`);
              continue;
            }

            let companyName = ticket.companyName || 
                            ticket.company || 
                            ticket.customer?.email?.split('@')[1] ||
                            ticket.primaryCustomer?.email?.split('@')[1] ||
                            'Unknown Company';
            
            const companyLetter = companyName.charAt(0).toUpperCase();
            
            successCount++;
            console.log(`  ✅ #${ticket.id || ticket.number} - ${ticket.subject} (${companyName})`);
            
            allTickets.push({
              ...ticket,
              companyName: companyName,
              companyLetter: companyLetter,
              sourceFile: jsonFile.name
            });
          }
        } catch (error) {
          console.error(`  ❌ Error processing ${jsonFile.name}:`, error.message);
          errorCount++;
        }
      }

      allTickets.sort((a, b) => {
        const idA = a.id || a.number || 0;
        const idB = b.id || b.number || 0;
        return idB - idA;
      });

      console.log(`🐺 Wolf Protocol Complete: ${successCount} tickets loaded, ${filteredCount} filtered`);

      setAllActiveTickets(allTickets);

      if (allTickets.length === 0 && filteredCount > 0) {
        setErrorMessage(`No legitimate support tickets found. ${filteredCount} tickets were filtered out.`);
      } else if (allTickets.length === 0 && errorCount > 0) {
        setErrorMessage(`Failed to load tickets. Encountered ${errorCount} errors.`);
      }

    } catch (error) {
      console.error('🐺 Wolf Protocol Error:', error);
      setErrorMessage(`Error loading active tickets: ${error.message}`);
    } finally {
      setLoadingDashboard(false);
    }
  };

  const selectCompany = (company) => {
    setSearchDomain(String(company.name || ''));
    setSelectedCompanyInfo(company);
    setShowDropdown(false);
  };

  const searchCompanyTickets = async () => {
    const domainToSearch = String(searchDomain || '').trim();
    if (!domainToSearch) return;
    
    setSearching(true);
    setConversations([]);
    setOverallAnalysis(null);
    setErrorMessage(null);
    
    try {
      const companyInfo = selectedCompanyInfo || availableCompanies.find(c => String(c.name) === domainToSearch);
      
      if (!companyInfo) {
        const firstLetter = domainToSearch.charAt(0).toUpperCase();
        
        const letterResponse = await fetch(
          `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/archive/${firstLetter}`,
          {
            headers: {
              'Authorization': `token ${githubToken}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          }
        );

        if (!letterResponse.ok) {
          setErrorMessage(`No folder found for letter "${firstLetter}"`);
          setSearching(false);
          return;
        }

        const letterContents = await letterResponse.json();
        const companyFolder = letterContents.find(item => 
          item.type === 'dir' && item.name.toLowerCase() === domainToSearch.toLowerCase()
        );

        if (!companyFolder) {
          setErrorMessage(`No company folder found for "${domainToSearch}"`);
          setSearching(false);
          return;
        }

        const folderResponse = await fetch(companyFolder.url, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        await loadTicketsFromFolder(folderResponse);
      } else {
        const folderResponse = await fetch(companyInfo.url, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        await loadTicketsFromFolder(folderResponse);
      }

    } catch (error) {
      console.error('Search error:', error);
      setErrorMessage(`Error: ${error.message}`);
    } finally {
      setSearching(false);
      setSelectedCompanyInfo(null);
    }
  };

  const loadTicketsFromFolder = async (folderResponse) => {
    if (!folderResponse.ok) {
      throw new Error('Failed to load company folder');
    }

    const folderContents = await folderResponse.json();
    
    const yearFolders = folderContents.filter(item => 
      item.type === 'dir' && /^\d{4}$/.test(item.name)
    );

    let allJsonFiles = [];

    if (yearFolders.length > 0) {
      const sortedYearFolders = yearFolders.sort((a, b) => parseInt(b.name) - parseInt(a.name));
      const latestYearFolder = sortedYearFolders[0];
      
      const yearResponse = await fetch(latestYearFolder.url, {
        headers: {
          'Authorization': `token ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (yearResponse.ok) {
        const yearContents = await yearResponse.json();
        
        const jsonFilesInYear = yearContents
          .filter(file => file.name.endsWith('.json'))
          .sort((a, b) => {
            const idA = parseInt(a.name.replace('.json', '')) || 0;
            const idB = parseInt(b.name.replace('.json', '')) || 0;
            return idB - idA;
          });
        
        allJsonFiles = jsonFilesInYear;
      }
    } else {
      allJsonFiles = folderContents
        .filter(file => file.name.endsWith('.json'))
        .sort((a, b) => {
          const idA = parseInt(a.name.replace('.json', '')) || 0;
          const idB = parseInt(b.name.replace('.json', '')) || 0;
          return idB - idA;
        });
    }

    if (allJsonFiles.length === 0) {
      setErrorMessage('No JSON files found for this company');
      return;
    }

    let allConversations = [];
    let filesProcessed = 0;
    
    for (const jsonFile of allJsonFiles.slice(0, 20)) {
      try {
        filesProcessed++;
        
        const fileResponse = await fetch(jsonFile.url, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3.raw'
          }
        });
        
        if (!fileResponse.ok) continue;
        
        const jsonData = await fileResponse.json();
        const conversationsArray = Array.isArray(jsonData) ? jsonData : [jsonData];
        
        const legitimateConversations = conversationsArray.filter(convo => {
          const hasAssignedTo = convo.assignee || 
                               convo.assignedTo || 
                               convo.owner || 
                               convo.assignee_id ||
                               convo.assignedToId ||
                               convo.ownerId ||
                               (convo._embedded && convo._embedded.assignee);
          
          const threads = convo.threads || convo.messages || (convo._embedded && convo._embedded.threads) || [];
          
          const hasReplies = Array.isArray(threads) && threads.some(thread => {
            const isStaffReply = thread.createdBy && thread.createdBy.email;
            const hasContent = thread.body || thread.text || thread.message;
            return isStaffReply && hasContent;
          });
          
          const notMarketingEmail = hasAssignedTo || hasReplies;
          const notSystemGenerated = convo.type !== 'workflow' && convo.status !== 'spam';
          const isLegitimate = (hasAssignedTo || hasReplies) && notMarketingEmail && notSystemGenerated;
          
          return isLegitimate;
        });
        
        allConversations.push(...legitimateConversations);
      } catch (error) {
        console.error('Error processing file:', error);
      }
    }
    
    if (allConversations.length === 0) {
      setErrorMessage('No legitimate support conversations found.');
      return;
    }
    
    setConversations(allConversations);
    await analyzeAllConversations(allConversations);
  };

  const analyzeAllConversations = async (convos) => {
    setLoading(true);
    
    try {
      const conversationText = convos.slice(0, 30).map((convo, idx) => {
        try {
          const subject = convo.subject || 'No subject';
          
          let threads = [];
          if (Array.isArray(convo.threads)) {
            threads = convo.threads;
          } else if (convo.messages && Array.isArray(convo.messages)) {
            threads = convo.messages;
          } else if (convo._embedded && convo._embedded.threads && Array.isArray(convo._embedded.threads)) {
            threads = convo._embedded.threads;
          }
          
          const threadText = threads.map(t => 
            `${t.createdBy?.email || 'Unknown'}: ${t.body || ''}`
          ).join('\n');
          
          return `Ticket ${idx + 1}: ${subject}\n${threadText}\n---`;
        } catch (e) {
          console.error('Error processing conversation:', e);
          return `Ticket ${idx + 1}: Error processing`;
        }
      }).join('\n\n');

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 3000,
          messages: [{
            role: "user",
            content: `Analyze these ${convos.length} support tickets and provide comprehensive insights in JSON format:

{
  "totalTickets": ${convos.length},
  "executiveSummary": "2-3 sentence overview",
  "ticketTypeDistribution": {"bug": 0, "feature_request": 0, "question": 0, "account_issue": 0, "integration_issue": 0, "performance": 0, "other": 0},
  "sentimentDistribution": {"positive": 0, "neutral": 0, "negative": 0, "frustrated": 0},
  "commonIssues": ["issue1", "issue2", "issue3"],
  "topImprovements": ["improvement1", "improvement2"],
  "avgResponseTime": "Xh",
  "avgResolutionTime": "Xh",
  "keyStakeholders": ["email1", "email2"],
  "supportTierDistribution": {"General Support": 0, "Technical": 0, "Billing": 0, "Product": 0},
  "emailSummary": "Professional email summarizing partnership",
  "responseTimeQuality": "excellent|good|needs_improvement",
  "customerSatisfactionScore": 75,
  "proactiveSuggestions": ["suggestion1", "suggestion2"],
  "riskFactors": ["risk1", "risk2"],
  "strengthAreas": ["strength1", "strength2"],
  "teamPerformance": {
    "mostResponsive": "team member",
    "avgFirstResponseTime": "Xh",
    "ticketResolutionRate": "X%"
  },
  "trendAnalysis": "Brief trend analysis",
  "nextActions": ["action1", "action2"]
}

Tickets:
${conversationText.substring(0, 20000)}

Respond ONLY with valid JSON.`
          }]
        })
      });

      const data = await response.json();
      const responseText = data.content.filter(item => item.type === "text").map(item => item.text).join("\n").trim();
      const parsed = JSON.parse(responseText.replace(/```json\n?|\n?```/g, '').trim());
      setOverallAnalysis(parsed);
    } catch (error) {
      console.error('Analysis error:', error);
      setErrorMessage('Error analyzing tickets. Please try again.');
    } finally {
      setLoading(false);
    }
  };

  const generateDraftReply = async (ticket) => {
    setGeneratingDraft(true);
    setExpandedTicket(ticket);
    setDraftReply(null);
    
    try {
      let threads = [];
      if (Array.isArray(ticket.threads)) {
        threads = ticket.threads;
      } else if (ticket.messages && Array.isArray(ticket.messages)) {
        threads = ticket.messages;
      } else if (ticket._embedded && ticket._embedded.threads) {
        threads = ticket._embedded.threads;
      }
      
      const threadText = threads.map(t => {
        const author = t.createdBy?.email || t.createdBy?.name || t.author || t.from || 'Unknown';
        const body = t.body || t.text || t.message || '';
        return `${author}: ${body}`;
      }).join('\n');

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 2000,
          messages: [{
            role: "user",
            content: `Analyze this support ticket and provide EXACTLY 3 troubleshooting steps.

SUBJECT: ${ticket.subject || 'No subject'}
COMPANY: ${ticket.companyName || 'Not specified'}
CUSTOMER EMAIL: ${ticket.customer?.email || ticket.primaryCustomer?.email || 'Not specified'}

CONVERSATION:
${threadText || 'No conversation'}

Return JSON with this exact structure (EXACTLY 3 steps):
{
  "troubleshootingSteps": [
    {
      "step": 1,
      "emoji": "🔍",
      "title": "Step Title",
      "diagnostic": "Diagnostic instruction",
      "resolution": "Resolution steps",
      "technical": true,
      "checkItems": ["item1", "item2", "item3"]
    },
    {
      "step": 2,
      "emoji": "🛠️",
      "title": "Step Title",
      "diagnostic": "Diagnostic instruction",
      "resolution": "Resolution steps",
      "technical": true,
      "checkItems": ["item1", "item2", "item3"]
    },
    {
      "step": 3,
      "emoji": "✅",
      "title": "Step Title",
      "diagnostic": "Diagnostic instruction",
      "resolution": "Resolution steps",
      "technical": false,
      "checkItems": ["item1", "item2", "item3"]
    }
  ],
  "customerReply": "Professional response"
}

Respond ONLY with valid JSON.`
          }]
        })
      });

      const data = await response.json();
      const reply = data.content.filter(item => item.type === "text").map(item => item.text).join("\n");
      const cleanedReply = reply.replace(/```json\n?|\n?```/g, '').trim();
      const parsed = JSON.parse(cleanedReply);
      setDraftReply(parsed);
    } catch (error) {
      console.error('Draft error:', error);
      setDraftReply({ 
        troubleshootingSteps: [],
        customerReply: 'Error generating reply. Please try again.' 
      });
    } finally {
      setGeneratingDraft(false);
    }
  };

  const copyToClipboard = (text) => {
    navigator.clipboard.writeText(text);
  };

  if (!tokenSet) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6 flex items-center justify-center">
        <div className="bg-slate-800 rounded-xl shadow-2xl p-8 max-w-md w-full border border-slate-700">
          <div className="flex items-center gap-3 mb-6">
            <Users className="w-10 h-10 text-emerald-400" />
            <div>
              <h1 className="text-3xl font-bold text-white">Wolf Customer Oracle</h1>
              <p className="text-slate-400 text-sm mt-1">AI-Powered Support Intelligence</p>
            </div>
          </div>
          
          <div className="bg-slate-900 border border-slate-600 rounded-lg p-4 mb-6">
            <p className="text-slate-300 text-sm leading-relaxed mb-3">
              To access the Help Scout archive, provide your GitHub Personal Access Token.
            </p>
            <p className="text-slate-400 text-xs">
              Your token is stored only in this session and never sent anywhere except GitHub's API.
            </p>
          </div>
          
          <div className="space-y-4">
            <div>
              <label className="block text-slate-300 text-sm font-medium mb-2">
                GitHub Personal Access Token
              </label>
              <input
                type="password"
                value={githubToken}
                onChange={(e) => setGithubToken(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleSetToken()}
                className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                placeholder="ghp_..."
              />
            </div>
            
            <button
              onClick={handleSetToken}
              disabled={!githubToken.trim()}
              className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200"
            >
              Connect to Archive
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
      <div className="max-w-7xl mx-auto">
        <div className="bg-slate-800 rounded-xl shadow-2xl p-8 mb-6 border border-slate-700">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-3">
              <Users className="w-10 h-10 text-emerald-400" />
              <div>
                <h1 className="text-4xl font-bold text-white">Wolf Customer Oracle</h1>
                <p className="text-slate-400 mt-1">AI-powered customer support intelligence</p>
              </div>
            </div>
            <button
              onClick={() => setTokenSet(false)}
              className="text-slate-400 hover:text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700"
            >
              Change Token
            </button>
          </div>
          
          <div className="flex gap-2 mb-6">
            <button
              onClick={() => setActiveView('dashboard')}
              className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                activeView === 'dashboard'
                  ? 'bg-emerald-600 text-white'
                  : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
              }`}
            >
              <TrendingUp className="w-5 h-5" />
              Dashboard - All Active Tickets
              {allActiveTickets.length > 0 && (
                <span className="ml-2 px-2 py-1 bg-orange-500 text-white rounded-full text-xs font-bold">
                  {allActiveTickets.length}
                </span>
              )}
            </button>
            <button
              onClick={() => setActiveView('company-search')}
              className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                activeView === 'company-search'

                  {Object.entries(overallAnalysis.ticketTypeDistribution).map(([type, count]) => (
                    count > 0 && (
                      <div key={type} className="flex items-center justify-between py-2 border-b border-slate-700 last:border-0">
                        <span className="text-slate-300 capitalize">{type.replace(/_/g, ' ')}</span>
                        <span className="text-emerald-400 font-semibold">{count}</span>
                      </div>
                    )
                  ))}
                </div>
              )}

              {overallAnalysis.supportTierDistribution && (
                <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                  <h3 className="text-lg font-bold text-white mb-4">Support Tier Distribution</h3>
                  {Object.entries(overallAnalysis.supportTierDistribution).map(([tier, count]) => (
                    count > 0 && (
                      <div key={tier} className="flex items-center justify-between py-2 border-b border-slate-700 last:border-0">
                        <span className="text-slate-300">{tier}</span>
                        <span className="text-blue-400 font-semibold">{count}</span>
                      </div>
                    )
                  ))}
                </div>
              )}
            </div>

            {overallAnalysis.keyStakeholders && overallAnalysis.keyStakeholders.length > 0 && (
              <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                <h3 className="text-lg font-bold text-white mb-3">Key Stakeholders</h3>
                <div className="flex flex-wrap gap-2">
                  {overallAnalysis.keyStakeholders.map((stakeholder, idx) => (
                    <span key={idx} className="px-3 py-1 bg-emerald-900 text-emerald-300 rounded-full text-sm">
                      {stakeholder}
                    </span>
                  ))}
                </div>
              </div>
            )}

            {overallAnalysis.commonIssues && overallAnalysis.commonIssues.length > 0 && (
              <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                <div className="flex items-center gap-2 mb-4">
                  <AlertCircle className="w-5 h-5 text-red-400" />
                  <h3 className="text-lg font-bold text-white">Common Issues</h3>
                </div>
                <div className="space-y-2">
                  {overallAnalysis.commonIssues.map((issue, idx) => (
                    <div key={idx} className="p-3 bg-red-900 bg-opacity-30 border border-red-800 rounded-lg text-red-200 text-sm">
                      {issue}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {conversations.filter(c => c.status === 'closed').length > 0 && (
              <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                <h3 className="text-lg font-bold text-white mb-4">Recent Activity (Latest First) - Resolved Tickets</h3>
                <div className="space-y-3">
                  {conversations
                    .filter(c => c.status === 'closed')
                    .sort((a, b) => (b.id || b.number || 0) - (a.id || a.number || 0))
                    .slice(0, 15)
                    .map((convo, idx) => (
                      <div key={idx} className="p-4 bg-slate-900 rounded-lg border border-slate-700">
                        <div className="flex items-start justify-between">
                          <div className="flex-1">
                            <div className="text-white font-medium">
                              #{convo.id || convo.number}: {convo.subject || 'No subject'}
                            </div>
                            <div className="text-sm text-slate-400 mt-1">
                              {convo.customer?.email || convo.primaryCustomer?.email || searchDomain}
                            </div>
                          </div>
                          <span className="px-2 py-1 bg-slate-700 text-slate-300 rounded text-xs">
                            {convo.status || 'closed'}
                          </span>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

export default WolfCustomerOracle;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WolfCustomerOracle />);
  </script>
</body>
